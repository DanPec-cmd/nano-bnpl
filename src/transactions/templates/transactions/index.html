<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNPL Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-gray-800">My BNPL Plans</h1>
        
        <!-- Input for Customer ID -->
        <div class="mb-8 flex gap-4">
            <input type="text" id="customerId" placeholder="Enter Customer UUID" class="p-2 border rounded w-full">
            <button onclick="loadPlans()" class="bg-blue-600 text-white px-4 py-2 rounded">Load Loans</button>
        </div>

        <!-- Plans Container -->
        <div id="plansList" class="grid gap-4">
            <!-- Plans will appear here -->
        </div>
    </div>

    <script>
async function loadPlans() {
    const id = document.getElementById('customerId').value;
    try {
        const res = await fetch(`/api/customers/${id}/plans`);
        
        if (!res.ok) {
            console.error("API error:", res.status);
            alert("Error loading plans. Check the console.");
            return;
        }

        const plans = await res.json();
        console.log("Data received:", plans); // Check your F12 Console!

        if (plans.length === 0) {
            alert("No plans found for this customer.");
        }

        const container = document.getElementById('plansList');
        container.innerHTML = plans.map(p => `...`).join('');
        
    } catch (err) {
        console.error("Fetch failed:", err);
    }
}
    </script>
</body>
</html>
